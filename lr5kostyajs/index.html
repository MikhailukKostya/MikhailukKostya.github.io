<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ToDo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>ToDo List</h1>

    <!-- Поле вводу нового завдання -->
    <input id="taskInput" type="text" placeholder="Введіть нове завдання і натисніть Enter">

    <!-- Кнопки сортування -->
    <div class="sort-buttons">
        <button id="showAll">Всі</button>
        <button id="showActive">Невиконані</button>
        <button id="showCompleted">Виконані</button>
    </div>

    <!-- Список задач -->
    <ul id="taskList"></ul>

    <script src="script.js"></script>
</body>
</html>
